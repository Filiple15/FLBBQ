                        <option>Nome A-Z</option>
                        <option>Nome Z-A</option>

                    </select>

                </div>

                <div class="barra-direita">

                    <label>

                        Exibir

                    <select id="quantidadeProdutos">

                    <div class="modo-visualizacao">

                        <button>
